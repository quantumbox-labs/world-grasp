[workspace]
resolver = "2"
members = ["crates/analog-core", "crates/analog-wasm", "src-tauri"]
# src-tauri needs WebKitGTK on Linux; CI on machines without it uses `-p analog-core -p analog-wasm`.
default-members = ["crates/analog-core", "crates/analog-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
