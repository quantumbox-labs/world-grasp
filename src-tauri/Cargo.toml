[package]
name = "analog-finder"
description = "Hokkaido Analog Finder desktop shell (Tauri v2). The UI is web/ and its logic runs as WASM."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "analog_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
analog-core = { path = "../crates/analog-core" }
serde.workspace = true
serde_json.workspace = true
# pi-rs agent harness (question panel in the desktop app). Build without it: --no-default-features
pi-rs = { git = "https://github.com/quantum-box/pi-rs", rev = "0fca3dcc27f030d7d2e048719af3a82d3f5b3e84", features = ["anthropic", "ollama"], optional = true }
tokio = { version = "1", features = ["sync", "time", "macros"], optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"

[features]
default = ["agent"]
agent = ["dep:pi-rs", "dep:tokio", "dep:async-trait"]
